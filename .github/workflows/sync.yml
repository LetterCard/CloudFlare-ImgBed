name: 同步上游文件

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: 同步上游文件
    runs-on: ubuntu-latest
    steps:
      # 拉取自己的仓库
      - name: 拉取上游仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 保存自己的 workflow
      - name: 备份工作流
        run: |
          mkdir -p /tmp/my-workflows
          cp -r .github/workflows/* /tmp/my-workflows/ || true

      # 同步上游
      - name: 同步上游文件
        run: |
          git remote remove upstream || true
          git remote add upstream \
          https://github.com/MarSeventh/CloudFlare-ImgBed.git

          git fetch upstream

          # 删除代码文件
          git rm -rf . || true

          # 拉取上游代码
          git checkout upstream/main -- .

          # 删除上游 workflow（为恢复自身工作流腾出位置）
          rm -rf .github/workflows

      # 恢复自己的 workflow
      - name: 恢复工作流
        run: |
          mkdir -p .github/workflows
          cp -r /tmp/my-workflows/* .github/workflows/

      # 清理上游残留的 .github 目录（仅保留 workflows）
      - name: 清理残留配置
        run: |
          # 删除 .github 下除 workflows 外的所有文件和文件夹（如上游的 ISSUE_TEMPLATE 等）
          find .github -mindepth 1 -maxdepth 1 ! -name "workflows" -exec rm -rf {} +
          # 兜底确保 workflows 目录存在
          mkdir -p .github/workflows

      # 替换品牌链接
      - name: 替换品牌链接
        run: |
          find . \
          -type f \
          ! -path "./.git/*" \
          ! -path "./.github/workflows/*" \
          -exec sed -i \
          's#https://github.com/MarSeventh/CloudFlare-ImgBed#https://1000.run#g' {} +

      # 提交代码
      - name: 提交代码
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          # 关键：不提交 workflow 文件（仅提交业务代码）
          git reset -- .github/workflows

          git commit \
          -m "同步上游并替换链接" \
          || echo "无变更"

      # 推送
      - name: 推送
        run: |
          git push origin main
